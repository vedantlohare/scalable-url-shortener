services:

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000

      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: url_shortener

      REDIS_HOST: redis

      JWT_SECRET: mySuperSecretKey123456

    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: url_shortener

    ports:
      - "5432:5432"

  redis:
    image: redis

    ports:
      - "6379:6379"